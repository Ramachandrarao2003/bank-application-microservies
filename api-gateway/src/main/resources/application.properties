spring.application.name=api-gateway

#server port
server.port=9090

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#spring boot admin monitor
spring.boot.admin.client.url=http://localhost:9099

# Gateway Routes
#Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
#Account Service
spring.cloud.gateway.routes[1].id=account-service
spring.cloud.gateway.routes[1].uri=lb://ACCOUNT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/accounts/**
#Transaction Servcie
spring.cloud.gateway.routes[2].id=transaction-service
spring.cloud.gateway.routes[2].uri=lb://TRANSACTION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/transactions/**
#Admin Servcie
spring.cloud.gateway.routes[3].id=admin-service
spring.cloud.gateway.routes[3].uri=lb://ADMIN-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/admin/**


# Auth Swagger
spring.cloud.gateway.routes[4].id=auth-swagger
spring.cloud.gateway.routes[4].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/auth-service/v3/api-docs
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/auth-service/v3/api-docs,/v3/api-docs
#Account Swagger 
spring.cloud.gateway.routes[5].id=account-swagger
spring.cloud.gateway.routes[5].uri=lb://ACCOUNT-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/account-service/v3/api-docs
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/account-service/v3/api-docs,/v3/api-docs
#Transaction Swagger
spring.cloud.gateway.routes[6].id=transaction-swagger
spring.cloud.gateway.routes[6].uri=lb://TRANSACTION-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/transaction-service/v3/api-docs
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/transaction-service/v3/api-docs,/v3/api-docs
#Admin Swagger
spring.cloud.gateway.routes[7].id=admin-swagger
spring.cloud.gateway.routes[7].uri=lb://ADMIN-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/admin-service/v3/api-docs
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/admin-service/v3/api-docs,/v3/api-docs

# Swagger Aggregation

springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=Account Service
springdoc.swagger-ui.urls[1].url=/account-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=Transaction Service
springdoc.swagger-ui.urls[2].url=/transaction-service/v3/api-docs

springdoc.swagger-ui.urls[3].name=Admin Service
springdoc.swagger-ui.urls[3].url=/admin-service/v3/api-docs

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

spring.cloud.gateway.routes[0].filters[0]=RewritePath=/auth-service/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[1].filters[0]=RewritePath=/account-service/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[2].filters[0]=RewritePath=/transaction-service/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[3].filters[0]=RewritePath=/admin-service/(?<segment>.*), /$\{segment}


