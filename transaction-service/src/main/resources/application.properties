spring.application.name=transaction-service


#Server port
server.port=8083

#To register with Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# To get alll Actuator
#management.endpoints.web.exposure.include=*

#To link with config server
spring.config.import=optional:configserver:

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging
logging.level.com.bank=INFO

# Feign
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#Spring boot admin monitor
spring.boot.admin.client.url=http://localhost:9099

#Circcuit Breaker

management.health.circuitbreakers.enabled=true
resilience4j.circuitbreaker.instances.accountService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=20s
resilience4j.circuitbreaker.instances.accountService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.accountService.automaticTransitionFromOpenToHalfOpenEnabled=true

#OpenApi Swagger
#springdoc.api-docs.path=/api-docs
#springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


